{% extends "base.html" %}

{% block title %}Add Livestock - {{ farm.name }}{% endblock %}

{% block content %}
<div class="agri-page">
    <a href="{{ url_for('agriculture.farm_detail', farm_id=farm.id) }}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to {{ farm.name }}
    </a>

    <div class="form-card">
        <h1><i class="fas fa-cow"></i> Add Livestock</h1>

        <form method="POST" class="agri-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="species">Species *</label>
                    <select id="species" name="species" required>
                        <option value="cattle">Cattle</option>
                        <option value="goats">Goats</option>
                        <option value="sheep">Sheep</option>
                        <option value="pigs">Pigs</option>
                        <option value="poultry">Poultry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="breed">Breed</label>
                    <input type="text" id="breed" name="breed" placeholder="e.g. Nguni, Brahman">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" step="0.1" placeholder="e.g. 3">
                </div>
                <div class="form-group">
                    <label for="age_unit">Unit</label>
                    <select id="age_unit" name="age_unit">
                        <option value="years">Years</option>
                        <option value="months">Months</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="health_status">Health Status</label>
                    <select id="health_status" name="health_status">
                        <option value="healthy">Healthy</option>
                        <option value="fair">Fair</option>
                        <option value="poor">Poor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estimated_weight_kg">Estimated Weight (kg)</label>
                    <input type="number" id="estimated_weight_kg" name="estimated_weight_kg" step="0.1" placeholder="e.g. 250">
                </div>
                <div class="form-group">
                    <label for="valuation_amount">Valuation (ZAR)</label>
                    <input type="number" id="valuation_amount" name="valuation_amount" step="0.01" placeholder="e.g. 15000">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add Livestock
            </button>
        </form>
    </div>
</div>
{% endblock %}
