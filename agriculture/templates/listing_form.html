{% extends "base.html" %}

{% block title %}Create Listing - Marketplace{% endblock %}

{% block content %}
<div class="agri-page">
    <a href="{{ url_for('agriculture.marketplace') }}" class="back-link">
        <i class="fas fa-arrow-left"></i> Marketplace
    </a>

    <div class="form-card">
        <h1><i class="fas fa-store"></i> Create Listing</h1>

        <form method="POST" class="agri-form">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" required placeholder="e.g. Nguni Cattle - 400kg">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="livestock">Livestock</option>
                        <option value="crops">Crops</option>
                        <option value="produce">Produce</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="asset_type">Asset Type</label>
                    <select id="asset_type" name="asset_type">
                        <option value="livestock">Livestock</option>
                        <option value="crop">Crop</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Describe your listing..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="farm_id">Farm</label>
                    <select id="farm_id" name="farm_id">
                        <option value="">Select farm</option>
                        {% for farm in farms %}
                        <option value="{{ farm.id }}">{{ farm.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="asset_id">Link to Asset</label>
                    <select id="asset_id" name="asset_id">
                        <option value="">Select asset</option>
                        {% for animal in livestock %}
                        <option value="{{ animal.id }}">{{ animal.species|title }} - {{ animal.breed or 'N/A' }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" step="0.1" placeholder="e.g. 10">
                </div>
                <div class="form-group">
                    <label for="unit">Unit</label>
                    <input type="text" id="unit" name="unit" placeholder="e.g. head, kg, bags">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="asking_price">Asking Price (ZAR) *</label>
                    <input type="number" id="asking_price" name="asking_price" required step="0.01" placeholder="e.g. 25000">
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g. Pretoria">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="verified_weight">Verified Weight (kg)</label>
                    <input type="number" id="verified_weight" name="verified_weight" step="0.1" placeholder="AI-estimated weight">
                </div>
                <div class="form-group">
                    <label for="verified_grade">Grade</label>
                    <input type="text" id="verified_grade" name="verified_grade" placeholder="e.g. A, Prime">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-publish"></i> Publish Listing
            </button>
        </form>
    </div>
</div>
{% endblock %}
