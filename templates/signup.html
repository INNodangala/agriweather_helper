{% extends "base.html" %}

{% block title %}Sign Up - AgriWeather Helper{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h1>Create Account</h1>
            <p>Join AgriWeather Helper today</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="full_name"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Phone (optional)</label>
                <input type="tel" id="phone" name="phone" placeholder="+27 82 123 4567">
            </div>

            <div class="form-group">
                <label for="role"><i class="fas fa-briefcase"></i> I am a</label>
                <select id="role" name="role" required>
                    <option value="farmer">Farmer</option>
                    <option value="buyer">Buyer / Butcher</option>
                    <option value="lender">Micro-Lender</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location"><i class="fas fa-map-marker-alt"></i> Location (optional)</label>
                <input type="text" id="location" name="location" placeholder="e.g. Pretoria, Gauteng">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label for="confirm_password"><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
